[project]
name = "bille-backend"
version = "0.1.0"
description = "API de Bille: finanzas personales para dos cuentas separadas"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pyjwt[crypto]>=2.9",
  "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integracion: requiere la base de datos local de Supabase"]

[tool.ruff]
line-length = 110
target-version = "py312"
